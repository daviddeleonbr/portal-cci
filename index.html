<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Força HTTPS em todos os recursos da página (evita "Inseguro" por
         mixed content quando alguma URL externa for cadastrada com http://) -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <link rel="icon" type="image/png" href="/logo-cci.png" />
    <link rel="apple-touch-icon" href="/logo-cci.png" />
    <link rel="mask-icon" href="/logo-cci.png" color="#1B8073" />
    <!-- Cor da barra de status (PWA instalado / barra do navegador no celular)
         = fundo do cabeçalho: #ffffff no claro, #1e293b no escuro. O script
         anti-flash abaixo e o useTheme trocam o `content` conforme o tema
         ESCOLHIDO no portal (não só o do sistema). Uma meta só, sem media —
         com várias, o navegador usa a 1ª que combina e ignora a escolha. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / instalação em tela inicial -->
    <meta name="application-name" content="CCI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CCI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonte Sora pra logo CCI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" />

    <title>CCI · Portal</title>

    <!-- Anti-flash (FOUC): aplica a classe .dark ANTES do bundle carregar,
         lendo o tema salvo (cci_theme) com fallback pro prefers-color-scheme.
         Mantém em sincronia com src/hooks/useTheme.js (mesma chave). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cci_theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#1e293b' : '#ffffff');
          // Tamanho do texto (src/lib/tamanhoTexto.js — mesma chave e escalas)
          var esc = { grande: 1.15, muito_grande: 1.3 }[localStorage.getItem('cci_tamanho_texto')];
          if (esc) document.documentElement.style.setProperty('--escala-texto', String(esc));
        } catch (e) { /* noop */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
